# ============================================
# Деплой на Render: два сервиса на один репозиторий.
#
# Схема: клиент и API живут на одном источнике — веб-узел (nginx) отдаёт
# статику и проксирует /api на API. Так кука сессии (httpOnly, SameSite=Lax)
# остаётся для одного домена и не требует CORS.
#
# Оба сервиса — Docker: образ сам собирает приложение и запускает его, а
# миграции базы применяются перед стартом. Настройки сервисов на Render
# меняются только здесь: после правки файла нажмите "Manual sync" у
# Blueprint (см. DEPLOY_RENDER.md).
# ============================================
services:
  # ============================================
  # API (NestJS + Prisma + Fastify)
  # ============================================
  - type: web
    name: priyomka-api
    runtime: docker
    repo: https://github.com/Slavik993/Acceptance-Facility-Management-System
    branch: main
    # Регион обязан совпадать с регионом базы: внутренний адрес PostgreSQL
    # доступен только сервисам того же региона.
    region: oregon
    plan: free
    # Контекст сборки — корень репозитория: образ собирает воркспейс целиком.
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Стендовый режим: кода подтверждения на площадке пока нет, отправитель
      # сообщений подключается к пилоту позже, поэтому код возвращается в
      # ответе и показывается на экране (П-28). С NODE_ENV=production сервер
      # не запускается: эхо и промышленный режим несовместимы.
      # Когда отправитель подключён — NODE_ENV=production и AUTH_ECHO снять.
      - key: NODE_ENV
        value: development
      - key: AUTH_ECHO
        value: "1"
      # Внутренний адрес базы Render. Пароль лежит в репозитории — смените
      # его в панели Render и храните новый только в переменных сервиса.
      - key: DATABASE_URL
        value: postgresql://priyomka_db_user:euRtl4m4wY61QfIYQdZUTO3EuKTVg2CG@dpg-dbg7vuavcj2c73belfeg-a/priyomka_db
      # Файлы на бесплатном плане живут в эфемерной файловой системе и
      # исчезают при пересоздании инстанса.
      - key: STORAGE_DIR
        value: /tmp/storage
      - key: WEB_ORIGIN
        value: https://priyomka-web.onrender.com

  # ============================================
  # Веб-клиент (сборка vite + nginx)
  # ============================================
  - type: web
    name: priyomka-web
    runtime: docker
    repo: https://github.com/Slavik993/Acceptance-Facility-Management-System
    branch: main
    region: oregon
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      # Адрес API для прокси. Внутренний адрес недоступен: статику и nginx
      # обслуживают публичные сервисы, поэтому проксируем по публичному URL.
      - key: API_UPSTREAM
        value: https://priyomka-api.onrender.com
