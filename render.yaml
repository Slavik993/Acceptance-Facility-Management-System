services:
  # ============================================
  # API (NestJS + Prisma)
  # ============================================
  # ВАЖНО: сначала создайте PostgreSQL вручную через UI Render,
  # затем скопируйте Internal Database URL и вставьте в env переменные сервиса
  - type: web
    name: priyomka-api
    runtime: docker
    repo: https://github.com/klemmerpavel-beep/Acceptance-Facility-Management-System
    branch: main
    region: frankfurt
    plan: free
    rootDir: apps/api
    healthCheckPath: /
    buildCommand: corepack enable && pnpm install && pnpm --filter @priyomka/api exec prisma generate && pnpm --filter @priyomka/api run build
    startCommand: pnpm --filter @priyomka/api run migrate:deploy && pnpm --filter @priyomka/api run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        value: postgresql://priyomka:PASSWORD@DB_HOST:5432/priyomka  # замените после создания БД
      - key: STORAGE_DIR
        value: /data/files
    disks:
      - name: api-files
        mountPath: /data
        sizeGB: 1
